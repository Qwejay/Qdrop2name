name: Build EXE and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动构建版本号 (例如: 1.1.0)'
        required: true
        default: '1.1.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install PyQt5 nuitka pillow exif pillow-heif

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ORIGINAL_VER="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ORIGINAL_VER="${{ github.event.inputs.version }}"
          else
            ORIGINAL_VER="1.1.0"
          fi
          
          CLEAN_VER=$(echo "$ORIGINAL_VER" | sed -E 's/^[vV]//g')
          METADATA_VER=$(echo "$CLEAN_VER" | cut -d'-' -f1)
          
          # 确保 metadata 版本号符合 Windows 版本号标准 (X.Y.Z)
          if [[ ! "$METADATA_VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            METADATA_VER="1.1.0"
          fi
          
          echo "clean_version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "metadata_version=$METADATA_VER" >> $GITHUB_OUTPUT
          echo "tag_name=v$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Determine Entry File & Sync Version
        id: entry
        shell: python
        run: |
          import re
          import os

          # 自动判定入口文件（兼容 Qdrop2name.py 或 main.py）
          entry_file = "Qdrop2name.py" if os.path.exists("Qdrop2name.py") else "main.py"
          if not os.path.exists(entry_file):
              raise FileNotFoundError("未找到入口文件 (Qdrop2name.py 或 main.py)")

          version = "${{ steps.version.outputs.clean_version }}"
          with open(entry_file, 'r', encoding='utf-8') as f:
              content = f.read()

          # 匹配并替换 __version__
          new_content = re.sub(
              r'(__version__\s*=\s*["\'])[^"\']+(["\'])',
              f'\\g<1>{version}\\g<2>',
              content,
              count=1
          )
          with open(entry_file, 'w', encoding='utf-8') as f:
              f.write(new_content)

          # 将最终入口文件名导出到环境
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gh_out:
              gh_out.write(f"entry_file={entry_file}\n")
              
          print(f"使用入口文件: {entry_file}，同步版本号为: {version}")

      - name: Build with Nuitka
        run: |
          $version = "${{ steps.version.outputs.clean_version }}"
          $metadataVersion = "${{ steps.version.outputs.metadata_version }}"
          $entryFile = "${{ steps.entry.outputs.entry_file }}"
          
          $nuitkaParams = @(
            "-m", "nuitka",
            "--standalone",
            "--onefile",
            "--windows-console-mode=disable",
            "--enable-plugin=pyqt5",
            "--include-package=PyQt5.QtWidgets",
            "--include-package=PyQt5.QtCore",
            "--include-package=PyQt5.QtGui",
            "--include-package=PIL",
            "--include-package=exif",
            "--include-package=pillow_heif",
            "--nofollow-import-to=tkinter",
            "--remove-output",
            "--lto=no",
            "--assume-yes-for-downloads",
            "--product-name=Qdrop2name",
            "--product-version=$metadataVersion",
            "--file-description=智能媒体文件重命名工具",
            "--copyright=QwejayHuang",
            "--output-dir=dist"
          )
          
          if (Test-Path "icon.ico") {
            $nuitkaParams += "--windows-icon-from-ico=icon.ico"
            $nuitkaParams += "--include-data-files=icon.ico=icon.ico"
          }
          
          $nuitkaParams += $entryFile
          
          python @nuitkaParams
          
          # 获取生成的目标 exe 原始名称
          $rawExeName = [System.IO.Path]::GetFileNameWithoutExtension($entryFile) + ".exe"
          $generatedExe = "dist/$rawExeName"
          $finalExe = "dist/Qdrop2name_$version.exe"
          $finalZip = "dist/Qdrop2name_$version.zip"
          
          if (Test-Path $generatedExe) {
            Rename-Item -Path $generatedExe -NewName "Qdrop2name_$version.exe"
            Compress-Archive -Path $finalExe -DestinationPath $finalZip
            Write-Host "成功生成构建文件：$finalZip"
          } else {
            Write-Error "编译失败：未在 dist 目录下找到 $rawExeName"
            exit 1
          }
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qdrop2name_build
          path: dist/Qdrop2name_*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            dist/Qdrop2name_*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
